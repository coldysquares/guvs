<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><title>The Bridge</title>
<style>
:root{--bg:#0f1115;--card:#171a20;--card2:#20242c;--text:#f5f5f5;--muted:#9ca3af;--line:#2f3540;--accent:#c4b5fd}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:680px;margin:auto;padding:18px 14px 32px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:30px;font-weight:800;letter-spacing:-.04em}.sub{font-size:13px;color:var(--muted);margin-top:2px}.year{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--accent);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.stat{background:#12151a;border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:8px;color:var(--muted);letter-spacing:.06em}
.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.chapter{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.scene{font-size:18px;line-height:1.5;white-space:pre-line}
.choices{display:grid;gap:10px;margin-top:18px}button{appearance:none;width:100%;border:1px solid #373e49;background:var(--card2);color:var(--text);border-radius:14px;padding:14px;font-size:16px;font-weight:650;text-align:left}button:active{transform:scale(.99);background:#292f39}
.controls{display:flex;gap:8px;margin-top:12px}.controls button{font-size:13px;text-align:center;padding:10px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
</style></head>
<body><main>
<header><div><div class="title">THE BRIDGE</div><div class="sub">A playable five-year life experiment.</div></div><div class="year" id="year"></div></header>
<div class="stats">
<div class="stat"><b id="stability"></b><span>STABILITY</span></div><div class="stat"><b id="agency"></b><span>AGENCY</span></div><div class="stat"><b id="energy"></b><span>ENERGY</span></div><div class="stat"><b id="meaning"></b><span>MEANING</span></div>
</div>
<div class="card"><div class="chapter" id="chapter"></div><div class="scene" id="scene"></div><div class="choices" id="choices"></div>
<div class="controls"><button onclick="back()">↶ Back</button><button onclick="restart()">↻ Restart</button></div></div><div class="foot" id="foot"></div>
</main>
<script>
const base={year:2026,stability:25,agency:15,energy:35,meaning:20,node:"start"};
let s=JSON.parse(localStorage.getItem("bridge-v2")||"null")||{...base},hist=[];
const N={
start:{c:"September 2026",t:"Your life has been happening one day at a time for years.\n\nYou do not need to pick your destiny tonight. You need a direction strong enough that tomorrow belongs to a larger story.\n\nWhat do you decide the next five years are FOR?",q:[["Buy back control of my time.","time"],["Build a life somewhere I actually chose.","place"],["Make the creative part of me the center, not the leftover.","create"],["First, stop the collapse.","stabilize"]]},
stabilize:{c:"Winter 2026",t:"You choose the unromantic move: stop the bleeding first.\n\nHousing. Income. Car. Bills. Debt.\n\nIt is not a philosophy. It is a floor.",f:{year:2027,stability:25,energy:5},q:[["Take a tolerable full-time job as a launchpad.","job"],["Hold out for flexible work.","flex"],["Patch together contract work.","contract"]]},
time:{c:"The Time Thesis",t:"You decide the scarce resource is not prestige. It is control over your own hours.\n\nBy 2031, most of your waking life should belong to you.\n\nFreedom still needs funding.",f:{agency:15,meaning:10},q:[["Earn hard for 18 months, then downshift.","job"],["Build around flexible work now.","flex"],["Build something that earns more than once.","asset"]]},
place:{c:"The Geography Thesis",t:"Providence is no longer the default answer.\n\nYou refuse to stay somewhere just because an old version of your life deposited you there.",f:{agency:15,meaning:8},q:[["Leave fast. Motion matters.","movefast"],["Build a relocation runway first.","runway"],["Aim for somewhere quieter and cheaper.","quiet"]]},
create:{c:"The Creative Thesis",t:"Music, writing, and making things stop being decorative extras.\n\nThey do not need to make you rich. Your future simply has to leave enough room for them to stay alive.",f:{meaning:20,agency:5},q:[["Take stable work, but put hard borders around it.","jobcreative"],["Build a cheap life around lots of free time.","lowburn"],["Try to make one thing pay for itself.","asset"]]},
job:{c:"2027 · Launchpad Job",t:"Money becomes predictable.\n\nThe danger appears quickly: a launchpad can quietly become the destination.",f:{year:2027,stability:25,agency:-8,energy:-10},q:[["Set a savings target and exit date.","runway"],["Keep the job. Maybe stability is enough.","trap"],["After six months, deliberately cut hours.","downshift"]]},
jobcreative:{c:"2027 · The Job Has Borders",t:"You take stable work with one rule: the job is not allowed to consume the person doing it.\n\nTwo evenings and one full day stay protected.",f:{year:2027,stability:22,meaning:14,energy:-5},q:[["Use stability to build a move fund.","runway"],["Use protected time to build something.","asset"],["Keep this balance.","balanced"]]},
flex:{c:"2027 · Thin Money, More Air",t:"The money is less impressive. Your calendar feels radically different.\n\nWhole weekdays exist that nobody owns.",f:{year:2027,stability:12,agency:22,energy:12,meaning:8},q:[["Keep expenses low and protect the freedom.","lowburn"],["Add one reliable retainer.","retainer"],["Build an income-producing project.","asset"]]},
contract:{c:"2027 · Freedom With Weather",t:"Some months feel brilliant. Others feel like the floor disappeared.\n\nAutonomy without a buffer is another form of panic.",f:{year:2027,stability:-8,agency:25,energy:-5},q:[["Build one reliable retainer.","retainer"],["Keep improvising.","fail"],["Take temporary stable work.","job"]]},
movefast:{c:"2027 · Fast Exit",t:"You leave Providence before the structure is ready.\n\nThe first month feels incredible because something finally changed. Then deposits, logistics, and money arrive.",f:{year:2027,stability:-20,agency:22,meaning:10},q:[["Take whatever work stabilizes the landing.","job"],["Keep betting on flexibility.","flex"],["Admit the move was early and rebuild.","rebuild"]]},
runway:{c:"2028 · Runway",t:"You build a real buffer. Not rich. Not retired.\n\nBut a bad boss, landlord, city, or month cannot dictate your next move immediately.\n\nFor the first time, 'no' has financial backing.",f:{year:2028,stability:28,agency:24,energy:8},q:[["Relocate deliberately.","map"],["Reduce paid work.","downshift"],["Build something of my own.","asset"]]},
downshift:{c:"2028 · Fewer Compulsory Hours",t:"You deliberately earn less in exchange for time.\n\nAt first it feels irresponsible. Then your brain learns a free Tuesday is not automatically a crisis.",f:{year:2028,agency:28,energy:24,meaning:15,stability:-4},q:[["Keep life cheap enough to sustain this.","lowburn"],["Give the free days to creative work.","maker"],["Use the time to choose where to live.","map"]]},
retainer:{c:"2028 · One Reliable Engine",t:"One recurring client covers a meaningful chunk of monthly life.\n\nIt is not passive. It is predictable. That is enough to change the shape of the week.",f:{year:2028,stability:20,agency:18,meaning:6},q:[["Stay small. Do not scale just because you can.","lowburn"],["Build a move fund.","map"],["Use the base to make something riskier.","asset"]]},
asset:{c:"2028 · Build Once, Benefit More Than Once",t:"You build a tiny tool, catalog, paid resource, license, or weird useful thing.\n\nMost attempts do nothing. One earns enough to matter.",f:{year:2028,stability:10,agency:24,meaning:22},q:[["Keep it intentionally small.","smallasset"],["Scale it aggressively.","scale"],["Let it subsidize a creative life.","maker"]]},
lowburn:{c:"2029 · Deliberate Smallness",t:"You stop treating more as automatically better.\n\nEvery recurring expense has to justify the hours of your life required to pay for it.",f:{year:2029,stability:20,agency:28,energy:15,meaning:14},q:[["Pair it with a small city I like.","smallcity"],["Pair it with creative time.","maker"],["Pair it with radical solitude.","quiet"]]},
map:{c:"2029 · Choose the Map",t:"You evaluate places by the life they make possible: cost, nature, walkability, solitude, culture, weather, noise, space.\n\nGeography is no longer inherited from work, friends, or inertia.",f:{year:2029,agency:25,meaning:14},q:[["A smaller city with nature and enough culture.","smallcity"],["A major city, but only with light work.","city"],["A quiet rural edge with remote income.","quiet"]]},
quiet:{c:"2030 · Quiet Edge",t:"You build a mostly remote life somewhere quiet. Days are spacious. Expenses are lower.\n\nThe risk is solitude quietly becoming isolation.",f:{year:2030,stability:18,agency:30,energy:20,meaning:12},q:[["Keep a few deliberate human ties.","people"],["I genuinely want very little social life.","endquiet"]]},
smallcity:{c:"2030 · Small City",t:"Your place is modest. Your monthly burn is manageable. Nature is close. There are enough people around that you are not stranded.\n\nOrdinary weeks begin to have a shape.",f:{year:2030,stability:18,agency:22,energy:16,meaning:16},q:[["Protect this. It does not need to get bigger.","endfree"],["Build a few real connections.","people"],["Use the stability to make more work.","maker"]]},
city:{c:"2030 · City, Different Rules",t:"You choose density again, but this time on your terms. Live smaller. Work less. Use the city instead of letting it use you.",f:{year:2030,stability:8,agency:12,meaning:15},q:[["Worth it. Keep the structure tight.","endcity"],["Too expensive. Take the lesson somewhere smaller.","smallcity"]]},
maker:{c:"2030 · The Work That Is Yours",t:"Music, writing, and making things become part of the weekly architecture.\n\nNot a reward after every obligation is complete. Some earns money. Some absolutely does not. It still counts.",f:{year:2030,agency:18,energy:10,meaning:30},q:[["Keep paid work small enough to protect this.","endmaker"],["Try to make it the main income source.","scale"]]},
smallasset:{c:"2030 · Tiny Machine",t:"The thing earns a modest amount without demanding your whole week.\n\nYou resist turning it into a startup. It remains a machine for buying back time.",f:{year:2030,stability:16,agency:30,meaning:18},q:[["Use the time to make things.","endmaker"],["Use the time mostly for nothing at all.","endfree"]]},
people:{c:"2031 · Chosen People",t:"You stop asking one inherited friend group to carry the entire meaning of belonging.\n\nA few people. Actual reciprocity. No popularity contest.",f:{year:2031,meaning:20,agency:10},q:[["See the life.","endchosen"]]},
balanced:{c:"2031 · Enough",t:"You never escaped work entirely. You simply stopped allowing it to consume the map.\n\nThe job funds the life. The life is not the job.",f:{year:2031,stability:25,agency:10,meaning:16},q:[]},
trap:{c:"2031 · Stable, Still Drifting",t:"You are financially safer. But the structure of life still belongs mostly to necessity.\n\nNot catastrophic. Just not the ending you were looking for.",f:{year:2031,stability:30,agency:-20,meaning:-15},q:[]},
scale:{c:"2031 · You Built Another Boss",t:"Revenue rises. So do meetings, deadlines, support, and people who need things from you.\n\nYou reinvented the thing you were trying to escape. Excellent data. Terrible ending.",f:{year:2031,stability:20,agency:-22,energy:-25},q:[]},
fail:{c:"2028 · The Floor Drops Out",t:"A bad month arrives, then another. Freedom becomes emergency management again.\n\nThis route fails. Failure is data.",f:{year:2028,stability:-35,energy:-20},q:[["Rebuild with stability first.","rebuild"]]},
rebuild:{c:"Rebuild",t:"The experiment was not stupid. It was missing an ingredient.\n\nThis time you build stability before the next leap.",f:{stability:15,meaning:5},q:[["Temporary stable work, then runway.","job"],["One reliable retainer first.","retainer"]]},
endfree:{c:"2031 · Your Time Is Yours",t:"You are not rich. You do not wake electrified by purpose every morning.\n\nBut most days are yours. You can make things, read, hike, disappear, sleep, or do absolutely nothing without the structure collapsing.\n\nThe future is no longer blank. It contains choices.",f:{year:2031,agency:18,meaning:18},q:[]},
endmaker:{c:"2031 · A Creative Life",t:"Making things is ordinary.\n\nYou make music because Tuesday exists and Tuesday has room in it. You write because your attention is not permanently mortgaged.\n\nThe work still belongs to you.",f:{year:2031,meaning:30,agency:14},q:[]},
endchosen:{c:"2031 · Chosen Company",t:"A place you chose. Enough money. Large stretches of solitude. Creative work. A few people you actually want around.\n\nNobody promised paradise.\n\nIt feels like your life.",f:{year:2031,meaning:25,agency:15},q:[]},
endcity:{c:"2031 · City on Your Terms",t:"You live in a city because you chose the friction and electricity.\n\nYou are not 'there.' You are here.\n\nAnd for once, here was chosen.",f:{year:2031,agency:20,meaning:20},q:[]},
endquiet:{c:"2031 · Quiet Life",t:"Your life is quiet enough to hear yourself think. You work remotely, minimally. You spend a lot of time alone.\n\nThe world would call it small.\n\nYou do not care.",f:{year:2031,agency:28,energy:20,meaning:16},q:[]}
};
function cap(x){return Math.max(0,Math.min(100,x))}
function fx(o){if(!o)return;if(o.year)s.year=o.year;["stability","agency","energy","meaning"].forEach(k=>{if(o[k])s[k]=cap(s[k]+o[k])})}
function go(to){hist.push({...s});s.node=to;fx(N[to].f);render()}
function render(){const n=N[s.node];document.getElementById("year").textContent=s.year;["stability","agency","energy","meaning"].forEach(k=>document.getElementById(k).textContent=s[k]);document.getElementById("chapter").textContent=n.c;document.getElementById("scene").textContent=n.t;const q=document.getElementById("choices");q.innerHTML="";(n.q||[]).forEach(([l,t])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>go(t);q.appendChild(b)});if(!(n.q||[]).length){const d=document.createElement("div");d.style.cssText="margin-top:16px;color:#9ca3af;font-size:13px;line-height:1.45";d.textContent="This ending is not a verdict. It is a clue about which tradeoffs felt livable. Restart and try another route.";q.appendChild(d)}localStorage.setItem("bridge-v2",JSON.stringify(s));document.getElementById("foot").textContent="Path length: "+hist.length+" choices";scrollTo({top:0,behavior:"smooth"})}
function back(){if(!hist.length)return;s=hist.pop();render()}function restart(){hist=[];s={...base};localStorage.removeItem("bridge-v2");render()}render();
</script></body></html>
